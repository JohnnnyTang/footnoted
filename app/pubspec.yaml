name: footnoted
description: "FootNoted - your life's footprints on a misted world map."
publish_to: 'none'
resolution: workspace

version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  footnoted_data: any
  footnoted_geo: any
  go_router: ^18.0.2
  intl: ^0.20.3
  maplibre_gl: ^0.27.1
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/map/
