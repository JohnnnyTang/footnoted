# Dart pub workspace root (D-008). Run `flutter pub get` here; every member
# shares the root pubspec.lock. Members declare `resolution: workspace`.
name: footnoted_workspace
publish_to: none

environment:
  sdk: ^3.13.5

workspace:
  - app
  - packages/footnoted_geo
  - packages/footnoted_data
  - tool
  # M0 spike (Stage 1 W1-W2). Removed with spike/ at G1; tag m0-spike.
  - spike/tracegen
  - spike/storage_bench
  - spike/render_bench
  - spike/h3_eval

# D-011: package:sqlite3 links SQLCipher (with R*Tree) on every platform.
# Build-hook user-defines are read only from the workspace root, so this is
# workspace-wide by design.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
